<!DOCTYPE html>
<html>
<head>
  <title>TOS UI</title>
  <style>
    /* Main brand colors and scaling factor */
    :root {
      --color-blue: #2a4595;
      --color-red:  #d91b11;
      --scale-factor: {{ ui_scale_factor }}; /* Scaling factor from config.yaml */
    }

    /* Reset / Base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f2f2f2;
      color: #333;
      font-size: calc(16px * var(--scale-factor)); /* Base font size */
    }

    /* Full-width top header with centered logos */
    .header {
      width: 100%;
      background-color: var(--color-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(4rem * var(--scale-factor));
      padding: calc(0.5rem * var(--scale-factor)) calc(1rem * var(--scale-factor));
    }
    .logo-tos {
      height: calc(100px * var(--scale-factor));
      object-fit: contain;
    }
    .logo-breda {
      height: calc(100px * var(--scale-factor));
      object-fit: contain;
    }
    .logo-stimulus {
      height: calc(50px * var(--scale-factor));
      object-fit: contain;
    }

    /* Container for the two sections + red lines */
    .two-sections {
      position: relative;    
      width: calc(900px * var(--scale-factor));          
      height: calc(505px * var(--scale-factor));         
      margin: calc(2rem * var(--scale-factor)) auto;     
      background-color: #f2f2f2;
    }

    /* Red lines for top & bottom boxes */
    .line-top-left {
      position: absolute;
      top: 0;
      left: calc(-5px * var(--scale-factor));
      width: calc(5px * var(--scale-factor));
      height: calc(500px * var(--scale-factor));
      background-color: var(--color-red);
    }
    .line-top-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: calc(5px * var(--scale-factor));
      top: calc(500px * var(--scale-factor));
      background-color: var(--color-red);
    }
    .line-bottom-right {
      position: absolute;
      top: calc(500px * var(--scale-factor));
      right: calc(-5px * var(--scale-factor));
      width: calc(5px * var(--scale-factor));
      height: calc(205px * var(--scale-factor));
      background-color: var(--color-red);
    }

    /* Top box: 300px tall */
    .box-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(500px * var(--scale-factor));
      background-color: #fff;
      border-radius: calc(6px * var(--scale-factor));
      box-shadow: 0 calc(2px * var(--scale-factor)) calc(4px * var(--scale-factor)) rgba(0,0,0,0.1);
      text-align: center;
      padding: calc(1.5rem * var(--scale-factor));
    }

    /* Bottom box: 200px tall */
    .box-bottom {
      position: absolute;
      top: calc(505px * var(--scale-factor));  
      left: 0;
      width: 100%;
      height: calc(200px * var(--scale-factor));
      background-color: #fff;
      border-radius: calc(6px * var(--scale-factor));
      box-shadow: 0 calc(2px * var(--scale-factor)) calc(4px * var(--scale-factor)) rgba(0,0,0,0.1);
      text-align: center;
      padding: calc(1.5rem * var(--scale-factor));
    }

    /* Headings */
    .box-top h2,
    .box-bottom h2 {
      margin-bottom: calc(1rem * var(--scale-factor));
      color: var(--color-blue);
      font-size: calc(1.5rem * var(--scale-factor)); /* Standard headings */
    }

    /* Buttons row(s) */
    .button-row {
      margin-top: calc(1rem * var(--scale-factor));
    }
    .btn {
      display: inline-block;
      width: calc(220px * var(--scale-factor));  /* fixed width for uniform button size */
      white-space: nowrap;
      text-align: center;
      padding: calc(0.7rem * var(--scale-factor));
      margin: calc(0.5rem * var(--scale-factor)) calc(0.75rem * var(--scale-factor));
      background-color: var(--color-blue);
      color: #fff;
      border-radius: calc(4px * var(--scale-factor));
      cursor: pointer;
      border: none;
      font-size: calc(1rem * var(--scale-factor));
      transition: background-color 0.2s ease-in-out;
    }
    .btn:hover {
      background-color: var(--color-red);
    }

    /* Fixed-width dropdown */
    #datasetsDropdown {
      width: calc(220px * var(--scale-factor)); 
      padding: calc(0.4rem * var(--scale-factor));
      font-size: calc(1rem * var(--scale-factor));
      margin: calc(0.5rem * var(--scale-factor)) calc(0.75rem * var(--scale-factor));
    }

    #modelsDropdown {
      width: calc(220px * var(--scale-factor)); 
      padding: calc(0.4rem * var(--scale-factor));
      font-size: calc(1rem * var(--scale-factor));
      margin: calc(0.5rem * var(--scale-factor)) calc(0.75rem * var(--scale-factor));
    }

    /* Dropdown with action icons */
    .dropdown-with-icons {
      position: relative;
      display: inline-block;
    }

    .dropdown-option-icons {
      position: absolute;
      right: calc(30px * var(--scale-factor));
      top: 50%;
      transform: translateY(-50%);
      display: none;
      gap: calc(4px * var(--scale-factor));
      z-index: 1000;
    }

    /* Only show icons on hover when there's a valid selection */
    .dropdown-with-icons.has-valid-selection:hover .dropdown-option-icons {
      display: flex;
    }

    /* Hide icons when dropdown is open */
    .dropdown-with-icons select:focus + .dropdown-option-icons {
      display: none;
    }

    .dropdown-option-icons .icon {
      cursor: pointer;
      padding: calc(2px * var(--scale-factor));
      border-radius: calc(3px * var(--scale-factor));
      font-size: calc(14px * var(--scale-factor));
      opacity: 0.7;
      transition: all 0.2s;
      position: relative;
    }

    .dropdown-option-icons .icon:hover {
      opacity: 1;
      background-color: rgba(244, 67, 54, 0.1);
      color: #f44336 !important;
      transform: scale(1.1);
    }

    .icon-rename {
      color: #2196F3;
    }

    .icon-delete {
      color: #f44336;
    }

    /* Tooltip styling */
    .dropdown-option-icons .icon::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: calc(4px * var(--scale-factor)) calc(8px * var(--scale-factor));
      border-radius: calc(4px * var(--scale-factor));
      font-size: calc(12px * var(--scale-factor));
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1001;
    }

    .dropdown-option-icons .icon:hover::after {
      opacity: 1;
    }

    /* Hide icons when dropdown is open */
    .dropdown-with-icons select:focus + .dropdown-option-icons {
      display: none;
    }

    /* Bottom Box sliders area */
    .settings-section h3 {
      margin-bottom: calc(1rem * var(--scale-factor));
      color: var(--color-blue);
      font-size: calc(1.2rem * var(--scale-factor));
    }
    .slider-row {
      margin: calc(1rem * var(--scale-factor)) auto;
      text-align: left;
      max-width: calc(400px * var(--scale-factor)); /* Increased from 300px to accommodate larger scaling */
    }
    .slider-row label {
      display: inline-block;
      min-width: calc(140px * var(--scale-factor)); /* Increased from 120px to accommodate longer text */
      font-size: calc(1rem * var(--scale-factor));
    }
    .slider-row input[type="range"] {
      vertical-align: middle;
      margin-left: calc(0.5rem * var(--scale-factor));
    }
    .slider-value {
      font-weight: bold;
      color: var(--color-blue);
      margin-left: calc(1rem * var(--scale-factor));
      font-size: calc(1rem * var(--scale-factor));
    }
  </style>
</head>
<body>
  <!-- Header with logos -->
  <div class="header">
    <img class="logo-tos" src="{{ url_for('static', filename='tos_logo.jpg') }}" alt="TOS Logo">
    <img class="logo-breda" src="{{ url_for('static', filename='breda_robotics_logo.png') }}" alt="Breda Robotics Logo">
    <img class="logo-stimulus" src="{{ url_for('static', filename='logo_stimulus.png') }}" alt="Stimulus Logo">
  </div>

  <!-- Main container for 2 boxes + the lines -->
  <div class="two-sections">
    <div class="line-top-left"></div>
    <div class="line-top-bottom"></div>
    <div class="line-bottom-right"></div>

    <!-- Top Box -->
    <div class="box-top">
      <h2>TOS UI Controls</h2>


      <!-- Datasets dropdown and models dropdown -->

      <div class="button-row">
        <div class="dropdown-with-icons">
          <select id="datasetsDropdown"
                  onmouseover="fetchDatasetsInBackground()" 
                  onfocus="fetchDatasetsInBackground()"
                  onchange="onDatasetSelected()">
            <option hidden value="">Select dataset...</option>
          </select>
          <div class="dropdown-option-icons">
            <span class="icon icon-rename" onclick="renameSelectedDataset()" data-tooltip="Rename dataset">✏️</span>
            <span class="icon icon-delete" onclick="deleteSelectedDataset()" data-tooltip="Delete dataset">🗑️</span>
          </div>
        </div>
        <button class="btn" onclick="sendCommand('train_policy')">
          Train Policy
        </button>

      </div>


      <div class="button-row">
        <button class="btn" onclick="sendCommand('record_episodes')">
          Record Episodes
        </button>
        <button class="btn" onclick="sendCommand('record_mistake')">
          Record Mistake
        </button>
      </div>

      <div class="button-row">
        <div class="dropdown-with-icons">
          <select id="modelsDropdown"
                  onmouseover="fetchModelsInBackground()" 
                  onfocus="fetchModelsInBackground()"
                  onchange="onModelSelected()">
            <option hidden value="">Select model...</option>
          </select>
          <div class="dropdown-option-icons">
            <span class="icon icon-rename" onclick="renameSelectedModel()" data-tooltip="Rename model">✏️</span>
            <span class="icon icon-delete" onclick="deleteSelectedModel()" data-tooltip="Delete model">🗑️</span>
          </div>
        </div>

        <button class="btn" onclick="sendCommand('run_policy')">
          Run Policy
        </button>
      </div>




      <div class="button-row">
        <button class="btn" onclick="sendCommand('stop')">
          Stop
        </button>
        <button class="btn" onclick="sendCommand('hard_stop')">
          Hard Stop
        </button>
      </div>
    </div>

    <!-- Bottom Box -->
    <div class="box-bottom">
      <h2>Settings</h2>
      <div class="settings-section">
      <!-- Recording Speed slider -->
      <div class="slider-row">
        <label for="recording_speed">Recording Speed:</label>
        <input type="range" id="recording_speed" name="recording_speed"
           min="0" max="2" value="1" step="1"
           oninput="updateSliderValueRecording(this.value)">
        <span class="slider-value" id="recording_speed_value">0.5</span>
      </div>

      <script>
        function updateSliderValueRecording(index) {
        const speeds = [0.25, 0.5, 1.0];
        const valueSpan = document.getElementById('recording_speed_value');
        valueSpan.textContent = speeds[index];
        }
        // Initialize with default value from config
        const defaultRecordingSpeed = 0.5; // Will be set by server template
        const speeds = [0.25, 0.5, 1.0];
        const defaultIndex = speeds.indexOf(defaultRecordingSpeed);
        if (defaultIndex >= 0) {
            document.getElementById('recording_speed').value = defaultIndex;
            updateSliderValueRecording(defaultIndex);
        } else {
            // Fallback to middle value if config speed not in array
            updateSliderValueRecording(1);
        }
      </script>

        <!-- Playback Speed slider -->
        <div class="slider-row">
          <label for="playback_speed">Playback Speed:</label>
          <!-- We'll treat this slider as an index into a discrete array. -->
          <input type="range" id="playback_speed" name="playback_speed"
                 min="0" max="3" value="0" step="1"
                 oninput="updateSliderValue('playback_speed', this.value)"
                 data-speeds="[]"  
          > <!-- We will fill this in at runtime -->
          <span class="slider-value" id="playback_speed_value">N/A</span>
        </div>
      </div>
    </div>
  </div>












  <script>
    /**
     * Setup information for single robot mode
     */
    const currentSetup = JSON.parse('{{ (setups[0]|tojson) if setups else ({"setup_id": "1"}|tojson) }}');
    const setupId = currentSetup.setup_id || '1';
    
    /**
     * Global: We'll store the latest array of {dataset_name} objects here.
     */
    window.datasets = [];

    /**
     * Global: Store locally created dataset and model names to persist them across refreshes
     */
    window.localDatasets = new Set(); // Set of dataset names for this single setup
    window.localModels = new Set();   // Set of model names for this single setup

    function sendCommand(cmd, itemName = null) {
      const params = new URLSearchParams({ 'message': cmd });
      
      // Add the setup_id for single robot mode
      params.append('setup_id', setupId);

      // Always attach the itemName if provided.
      // For recording commands, this will be the recording_name
      // For dataset commands, this will be the dataset_name
      if (itemName) {
        if (cmd.includes('recording') || cmd === 'play_recording' || cmd === 'delete_recording') {
          params.append('recording_name', itemName);
        } else if (cmd.includes('dataset') || cmd === 'load_dataset' || cmd === 'run_policy' || cmd === 'train_policy') {
          // Don't send the special "NEW_DATASET" value
          if (itemName !== 'NEW_DATASET') {
            params.append('dataset_name', itemName);
          }
        } else {
          // Generic fallback - avoid sending special values
          if (itemName !== 'NEW_DATASET' && itemName !== 'NEW_MODEL') {
            params.append('item_name', itemName);
          }
        }
      }

      // For record_episodes, run_policy, and train_policy commands, automatically include the selected dataset
      if (cmd === 'record_episodes' || cmd === 'run_policy' || cmd === 'train_policy' || cmd === 'record_episode'|| cmd === 'record_mistake') {
        const datasetsDropdown = document.getElementById('datasetsDropdown');
        const selectedDataset = datasetsDropdown ? datasetsDropdown.value : '';
        // Don't send the special "NEW_DATASET" value
        if (selectedDataset && selectedDataset !== 'NEW_DATASET') {
          params.append('dataset_name', selectedDataset);
        }
      }

      // For run_policy and train_policy commands, also include the selected model
      if (cmd === 'run_policy' || cmd === 'train_policy') {
        const modelsDropdown = document.getElementById('modelsDropdown');
        const selectedModel = modelsDropdown ? modelsDropdown.value : '';
        // Don't send the special "NEW_MODEL" value
        if (selectedModel && selectedModel !== 'NEW_MODEL') {
          params.append('model_name', selectedModel);
        }
      }

      // Always fetch both speeds from the UI sliders.
      const rSpeed = getRecordingSpeed();
      const pSpeed = getPlaybackSpeed();
      params.append('recording_speed', rSpeed);
      params.append('playback_speed', pSpeed);

      // POST to /send_command
      fetch('/send_command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      })
      .then(r => r.json())
      .then(data => {
        // After successful operations that create/modify datasets or models, update icon visibility
        if (data.success) {
          // Commands that make datasets "real" and renameable
          if (cmd === 'record_episodes' || cmd === 'record_episode' || cmd === 'record_mistake') {
            // Immediately remove data-custom attribute for current selection
            const datasetsDropdown = document.getElementById('datasetsDropdown');
            const currentValue = datasetsDropdown.value;
            if (currentValue) {
              const currentOption = datasetsDropdown.querySelector(`option[value="${currentValue}"]`);
              if (currentOption && currentOption.getAttribute('data-custom') === 'true') {
                currentOption.removeAttribute('data-custom');
                // Update icon visibility immediately
                updateIconVisibility('datasetsDropdown', currentValue);
              }
            }
            // Also refresh datasets data for consistency
            setTimeout(() => {
              refreshDatasetsAndUpdateIcons();
            }, 200);
          }
          
          // Commands that make models "real" and renameable  
          if (cmd === 'train_policy') {
            // Immediately remove data-custom attribute for current selection
            const modelsDropdown = document.getElementById('modelsDropdown');
            const currentValue = modelsDropdown.value;
            if (currentValue) {
              const currentOption = modelsDropdown.querySelector(`option[value="${currentValue}"]`);
              if (currentOption && currentOption.getAttribute('data-custom') === 'true') {
                currentOption.removeAttribute('data-custom');
                // Update icon visibility immediately
                updateIconVisibility('modelsDropdown', currentValue);
              }
            }
            // Also refresh models data for consistency
            setTimeout(() => {
              refreshModelsAndUpdateIcons();
            }, 200);
          }
        }
      })
      .catch(err => console.error("Error sending command:", err));
    }

    /**
     * For the "Recording Speed" slider, we assume an index of [0, 1, 2]
     * mapping to [0.25, 0.5, 1.0].
     */
    function getRecordingSpeed() {
      const slider = document.getElementById('recording_speed');
      const index = parseInt(slider.value, 10);
      const speeds = [0.25, 0.5, 1.0];
      return speeds[index]; // e.g. 0.5
    }

    /**
     * For the "Playback Speed" slider, we read a dynamic array from data-speeds,
     * then use the slider's value as an array index.
     */
    function getPlaybackSpeed() {
      const playbackSlider = document.getElementById('playback_speed');
      const speeds = JSON.parse(playbackSlider.getAttribute('data-speeds') || "[]");
      const index = parseInt(playbackSlider.value, 10);

      if (index >= 0 && index < speeds.length) {
        return speeds[index]; // e.g. 2.0
      }
      return 1.0; // fallback
    }

    /**
     * Fetch latest datasets from server, store them globally in window.datasets,
     * and repopulate a datasets dropdown with the dataset_name values.
     */
    function fetchDatasetsInBackground() {
      const dropdown = document.getElementById('datasetsDropdown');
      if (!dropdown) {
        console.warn('datasetsDropdown element not found');
        return;
      }
      
      const oldSelected = dropdown.value;
      
      // Store the current custom dataset if it exists
      let customDataset = null;
      const customOption = dropdown.querySelector('option[data-custom="true"]');
      if (customOption) {
        customDataset = {
          value: customOption.value,
          displayName: customOption.textContent
        };
      }

      fetch('/request_datasets', { method: 'POST' })
        .then(response => response.json())
        .then(datasetObjects => {
          // Store entire array so we can look up additional info later
          window.datasets = datasetObjects;

          // Clear dropdown completely and rebuild
          dropdown.innerHTML = "";
          const placeholder = document.createElement('option');
          placeholder.value = "";
          placeholder.hidden = true;
          placeholder.textContent = "Select dataset...";
          dropdown.appendChild(placeholder);

          // Create a set to track all dataset names to avoid duplicates
          const allDatasetNames = new Set();

          // Add server-provided datasets first
          datasetObjects.forEach(obj => {
            const { dataset_name } = obj;
            if (!allDatasetNames.has(dataset_name)) {
              const opt = document.createElement('option');
              opt.value = dataset_name;
              opt.textContent = dataset_name;
              dropdown.appendChild(opt);
              allDatasetNames.add(dataset_name);
            }
          });

          // Re-add the single custom dataset if it exists and wasn't found in server datasets
          if (customDataset && !datasetObjects.some(obj => obj.dataset_name === customDataset.value)) {
            const opt = document.createElement('option');
            opt.value = customDataset.value;
            opt.textContent = customDataset.displayName;
            opt.setAttribute('data-custom', 'true');
            dropdown.appendChild(opt);
            allDatasetNames.add(customDataset.value);
          }

          // Add "New..." option
          const newOpt = document.createElement('option');
          newOpt.value = "NEW_DATASET";
          newOpt.textContent = "New...";
          dropdown.appendChild(newOpt);

          // Restore old selection if it exists in the combined list
          if (allDatasetNames.has(oldSelected)) {
            dropdown.value = oldSelected;
          } else {
            dropdown.value = "";
          }
        })
        .catch(err => console.error('Error fetching datasets:', err));
    }

    /**
     * Called whenever the user selects a new dataset in the dropdown.
     */
    function onDatasetSelected() {
      const dropdown = document.getElementById('datasetsDropdown');
      const selectedDataset = dropdown.value;
      
      // Update icon visibility based on valid selection (this handles empty selections correctly)
      updateIconVisibility('datasetsDropdown', selectedDataset);
      
      if (!selectedDataset) return;

      // Handle "New..." option
      if (selectedDataset === "NEW_DATASET") {
        const now = new Date();
        const defaultName = setupId.padStart(2, '0') + '_' +
                           now.getFullYear().toString() + 
                           (now.getMonth() + 1).toString().padStart(2, '0') + 
                           now.getDate().toString().padStart(2, '0') + '_' +
                           now.getHours().toString().padStart(2, '0') + 
                           now.getMinutes().toString().padStart(2, '0') + 
                           now.getSeconds().toString().padStart(2, '0');
        
        const newName = prompt('Enter new dataset name:', defaultName);
        if (newName && newName.trim()) {
          // Remove any existing custom dataset first
          const existingCustomOption = dropdown.querySelector('option[data-custom="true"]');
          if (existingCustomOption) {
            existingCustomOption.remove();
          }
          
          // Track this locally created dataset
          window.localDatasets.add(newName.trim());
          
          // Create a new option with the entered name
          const newOpt = document.createElement('option');
          newOpt.value = newName.trim();
          newOpt.textContent = newName.trim();
          // Mark as custom dataset
          newOpt.setAttribute('data-custom', 'true');
          // Insert before the "New..." option
          dropdown.insertBefore(newOpt, dropdown.lastElementChild);
          dropdown.value = newName.trim();
        } else {
          // Reset to empty if cancelled or empty
          dropdown.value = "";
          return;
        }
      }
      
      // Clear the models dropdown and fetch models for the new dataset
      const modelsDropdown = document.getElementById('modelsDropdown');
      if (modelsDropdown) {
        modelsDropdown.innerHTML = '<option hidden value="">Select model...</option>';
        
        // Only fetch models if this is not a locally created dataset
        const isLocalDataset = window.localDatasets.has(dropdown.value);
        if (!isLocalDataset) {
          // Fetch models for the new dataset
          fetchModelsInBackground();
        } else {
          // For locally created datasets, just add the "New..." option
          const newOpt = document.createElement('option');
          newOpt.value = "NEW_MODEL";
          newOpt.textContent = "New...";
          modelsDropdown.appendChild(newOpt);
        }
      }
    }

    /**
     * Load the selected dataset.
     */
    function loadSelectedDataset() {
      const dropdown = document.getElementById('datasetsDropdown');
      const selectedDataset = dropdown.value;
      
      if (!selectedDataset) {
        alert('Please select a dataset first.');
        return;
      }

      // Use the sendCommand function but pass the dataset name as the second parameter
      // For now, we'll use 'load_dataset' as the command - this would need to be implemented in the backend
      sendCommand('load_dataset', selectedDataset);
    }

    /**
     * Fetch latest models from server, store them globally in window.models,
     * and repopulate the models dropdown with the model_name values.
     */
    function fetchModelsInBackground() {
      const dropdown = document.getElementById('modelsDropdown');
      if (!dropdown) {
        console.warn('modelsDropdown element not found');
        return;
      }
      
      const oldSelected = dropdown.value;
      
      // Get the currently selected dataset to filter models
      const datasetsDropdown = document.getElementById('datasetsDropdown');
      const selectedDataset = datasetsDropdown ? datasetsDropdown.value : '';

      if (!selectedDataset || selectedDataset === "NEW_DATASET") {
        return;
      }

      // Check if this is a locally created dataset that doesn't exist on server yet
      const isLocalDataset = window.localDatasets.has(selectedDataset);
      if (isLocalDataset) {
        // Build dropdown with locally created models
        dropdown.innerHTML = "";
        const placeholder = document.createElement('option');
        placeholder.value = "";
        placeholder.hidden = true;
        placeholder.textContent = "Select model...";
        dropdown.appendChild(placeholder);
        
        // Add any locally created models
        const allModelNames = new Set();
        window.localModels.forEach(localModel => {
          const opt = document.createElement('option');
          opt.value = localModel;
          opt.textContent = localModel;
          dropdown.appendChild(opt);
          allModelNames.add(localModel);
        });
        
        // Add "New..." option
        const newOpt = document.createElement('option');
        newOpt.value = "NEW_MODEL";
        newOpt.textContent = "New...";
        dropdown.appendChild(newOpt);
        
        // Restore old selection if it exists in the local models
        if (allModelNames.has(oldSelected)) {
          dropdown.value = oldSelected;
        } else {
          dropdown.value = "";
        }
        return;
      }

      const formData = new FormData();
      formData.append('dataset_name', selectedDataset);

      fetch('/request_models', { 
        method: 'POST',
        body: formData
      })
        .then(response => response.json())
        .then(modelObjects => {
          // Store entire array so we can look up additional info later
          window.models = modelObjects;
          
          // Store the current custom model if it exists
          let customModel = null;
          const customOption = dropdown.querySelector('option[data-custom="true"]');
          if (customOption) {
            customModel = {
              value: customOption.value,
              displayName: customOption.textContent
            };
          }

          // Clear dropdown completely and rebuild
          dropdown.innerHTML = "";
          const placeholder = document.createElement('option');
          placeholder.value = "";
          placeholder.hidden = true;
          placeholder.textContent = "Select model...";
          dropdown.appendChild(placeholder);

          // Create a set to track all model names to avoid duplicates
          const allModelNames = new Set();

          // Add server-provided models first
          modelObjects.forEach(obj => {
            const { model_name } = obj;
            if (!allModelNames.has(model_name)) {
              const opt = document.createElement('option');
              opt.value = model_name;
              opt.textContent = model_name;
              dropdown.appendChild(opt);
              allModelNames.add(model_name);
            }
          });

          // Re-add the single custom model if it exists and wasn't found in server models
          if (customModel && !modelObjects.some(obj => obj.model_name === customModel.value)) {
            const opt = document.createElement('option');
            opt.value = customModel.value;
            opt.textContent = customModel.displayName;
            opt.setAttribute('data-custom', 'true');
            dropdown.appendChild(opt);
            allModelNames.add(customModel.value);
          }

          // Add "New..." option
          const newOpt = document.createElement('option');
          newOpt.value = "NEW_MODEL";
          newOpt.textContent = "New...";
          dropdown.appendChild(newOpt);

          // Restore old selection if it exists in the combined list
          if (allModelNames.has(oldSelected)) {
            dropdown.value = oldSelected;
          } else {
            dropdown.value = "";
          }
        })
        .catch(err => console.error('Error fetching models:', err));
    }

    /**
     * Called whenever the user selects a new model in the dropdown.
     */
    function onModelSelected() {
      const dropdown = document.getElementById('modelsDropdown');
      const selectedModel = dropdown.value;
      
      // Update icon visibility based on valid selection
      updateIconVisibility('modelsDropdown', selectedModel);
      
      if (!selectedModel) return;

      // Handle "New..." option
      if (selectedModel === "NEW_MODEL") {
        const now = new Date();
        const defaultName = setupId.padStart(2, '0') + '_' +
                           now.getFullYear().toString() + 
                           (now.getMonth() + 1).toString().padStart(2, '0') + 
                           now.getDate().toString().padStart(2, '0') + '_' +
                           now.getHours().toString().padStart(2, '0') + 
                           now.getMinutes().toString().padStart(2, '0') + 
                           now.getSeconds().toString().padStart(2, '0');
        
        const newName = prompt('Enter new model name:', defaultName);
        if (newName && newName.trim()) {
          // Remove any existing custom model first
          const existingCustomOption = dropdown.querySelector('option[data-custom="true"]');
          if (existingCustomOption) {
            existingCustomOption.remove();
          }
          
          // Track this locally created model
          window.localModels.add(newName.trim());
          
          // Create a new option with the entered name
          const newOpt = document.createElement('option');
          newOpt.value = newName.trim();
          newOpt.textContent = newName.trim();
          // Mark as custom model
          newOpt.setAttribute('data-custom', 'true');
          // Insert before the "New..." option
          dropdown.insertBefore(newOpt, dropdown.lastElementChild);
          dropdown.value = newName.trim();
        } else {
          // Reset to empty if cancelled or empty
          dropdown.value = "";
          return;
        }
      }
    }

    /**
     * Load the selected model.
     */
    function loadSelectedModel() {
      const dropdown = document.getElementById('modelsDropdown');
      const selectedModel = dropdown.value;
      
      if (!selectedModel) {
        alert('Please select a model first.');
        return;
      }

      // Use the sendCommand function but pass the model name as the second parameter
      sendCommand('load_model', selectedModel);
    }

    /**
     * Called when "Rename Dataset" button is clicked.
     */
    function renameSelectedDataset() {
      const dropdown = document.getElementById('datasetsDropdown');
      const selected = dropdown.value;
      if (!selected) {
        alert("No dataset selected to rename!");
        return;
      }
      
      // First refresh the datasets to ensure we have the latest list from the server
      fetch('/request_datasets', { method: 'POST' })
        .then(response => response.json())
        .then(datasetObjects => {
          // Update the global datasets list
          window.datasets = datasetObjects;
          
          // Now perform the checks with the updated data
          checkAndRenameDataset(selected);
        })
        .catch(err => {
          console.error('Error fetching datasets for rename check:', err);
          // If we can't fetch datasets, fall back to the old behavior
          checkAndRenameDataset(selected);
        });
    }

    /**
     * Helper function to check if dataset can be renamed and perform the rename
     */
    function checkAndRenameDataset(selected) {
      const dropdown = document.getElementById('datasetsDropdown');
      
      // Check if this is a custom dataset that hasn't been used yet
      const selectedOption = dropdown.querySelector(`option[value="${selected}"]`);
      if (selectedOption && selectedOption.getAttribute('data-custom') === 'true') {
        // Check if it now exists in the server datasets (after refresh)
        const existingDataset = window.datasets.find(d => d.dataset_name === selected);
        if (!existingDataset) {
          // This is still a custom dataset that was created but never used for actual recording
          alert(`Cannot rename "${selected}" because it hasn't been used for recording yet. Please record episodes with this name first, or just create a new name.`);
          return;
        }
      }
      
      // Check if this dataset exists in the server's dataset list (after refresh)
      const existingDataset = window.datasets.find(d => d.dataset_name === selected);
      if (!existingDataset) {
        alert(`Cannot rename "${selected}" because no dataset exists yet. Please record episodes with this name first.`);
        return;
      }
      
      // Prompt for new name
      const newName = prompt('Enter new dataset name:', selected);
      if (newName && newName.trim() && newName.trim() !== selected) {
        sendRenameDatasetCommand(selected, newName.trim());
      }
    }

    /**
     * Send rename command with old and new dataset names.
     */
    function sendRenameDatasetCommand(oldName, newName) {
      const params = new URLSearchParams({ 'message': 'rename_dataset' });
      params.append('old_dataset_name', oldName);
      params.append('new_dataset_name', newName);

      // Add the setup_id for single robot mode
      params.append('setup_id', setupId);

      // Always fetch both speeds from the UI sliders.
      const rSpeed = getRecordingSpeed();
      const pSpeed = getPlaybackSpeed();
      params.append('recording_speed', rSpeed);
      params.append('playback_speed', pSpeed);
      
      // Send command
      fetch('/send_command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      })
      .then(r => r.json())
      .then(data => {
        // Handle successful rename
        if (data.status === 'ok') {
          // Update the dropdown immediately to reflect the rename
          updateDatasetDropdownAfterRename(oldName, newName);
          // Also refresh the datasets list from server to ensure consistency
          fetchDatasetsInBackground();
        }
      })
      .catch(err => console.error(`Error sending rename dataset command:`, err));
    }

    /**
     * Update the dataset dropdown immediately after a successful rename operation.
     */
    function updateDatasetDropdownAfterRename(oldName, newName) {
      const dropdown = document.getElementById('datasetsDropdown');
      
      // Find the option with the old name
      const oldOption = dropdown.querySelector(`option[value="${oldName}"]`);
      if (oldOption) {
        // Update the option's value and text
        oldOption.value = newName;
        oldOption.textContent = newName;
        
        // Remove custom attribute if it exists (since it's now a real dataset)
        oldOption.removeAttribute('data-custom');
        
        // Keep this option selected
        dropdown.value = newName;
      }
    }

    /**
     * Called when "Rename Model" button is clicked.
     */
    function renameSelectedModel() {
      const dropdown = document.getElementById('modelsDropdown');
      const selected = dropdown.value;
      if (!selected) {
        alert("No model selected to rename!");

    /**

    /**
     * Delete the selected dataset after confirmation
     */
    function deleteSelectedDataset() {
      const dropdown = document.getElementById('datasetsDropdown');
      const selected = dropdown.value;
      
      if (!selected || selected === "" || selected === "NEW_DATASET") {
        alert("Please select a dataset to delete first.");
        return;
      }
      
      // Confirm deletion
      if (!confirm(`Are you sure you want to delete the dataset "${selected}"? This action cannot be undone and will delete all associated episodes and models.`)) {
        return;
      }
      
      sendDeleteDatasetCommand(selected);
    }

    /**
     * Send delete dataset command
     */
    function sendDeleteDatasetCommand(datasetName) {
      const params = new URLSearchParams({ 'message': 'delete_dataset' });
      params.append('dataset_name', datasetName);

      // Add the setup_id for single robot mode
      params.append('setup_id', setupId);

      // Always fetch both speeds from the UI sliders.
      const rSpeed = getRecordingSpeed();
      const pSpeed = getPlaybackSpeed();
      params.append('recording_speed', rSpeed);
      params.append('playback_speed', pSpeed);
      
      // Send command
      fetch('/send_command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      })
      .then(r => r.json())
      .then(data => {
        console.log(`Delete dataset response:`, data);
        // Remove the dataset from the dropdown
        const dropdown = document.getElementById('datasetsDropdown');
        const optionToRemove = dropdown.querySelector(`option[value="${datasetName}"]`);
        if (optionToRemove) {
          optionToRemove.remove();
        }
        // Reset dropdown to empty
        dropdown.value = "";
        // Also clear models dropdown since dataset was deleted
        const modelsDropdown = document.getElementById('modelsDropdown');
        if (modelsDropdown) {
          modelsDropdown.innerHTML = '<option hidden value="">Select model...</option>';
          modelsDropdown.value = "";
        }
        // Refresh the datasets list from server
        fetchDatasetsInBackground();
      })
      .catch(err => {
        console.error('Error deleting dataset:', err);
        alert('An error occurred while deleting the dataset.');
      });
    }

    /**
     * Delete the selected model after confirmation
     */
    function deleteSelectedModel() {
      const modelsDropdown = document.getElementById('modelsDropdown');
      const datasetsDropdown = document.getElementById('datasetsDropdown');
      const selectedModel = modelsDropdown.value;
      const selectedDataset = datasetsDropdown.value;
      
      if (!selectedModel || selectedModel === "" || selectedModel === "NEW_MODEL") {
        alert("Please select a model to delete first.");
        return;
      }
      
      if (!selectedDataset || selectedDataset === "" || selectedDataset === "NEW_DATASET") {
        alert("Please select a dataset first. Models are organized by dataset.");
        return;
      }
      
      // Confirm deletion
      if (!confirm(`Are you sure you want to delete the model "${selectedModel}" from dataset "${selectedDataset}"? This action cannot be undone.`)) {
        return;
      }
      
      sendDeleteModelCommand(selectedModel, selectedDataset);
    }

    /**
     * Send delete model command
     */
    function sendDeleteModelCommand(modelName, datasetName) {
      const params = new URLSearchParams({ 'message': 'delete_model' });
      params.append('model_name', modelName);
      params.append('dataset_name', datasetName);

      // Add the setup_id for single robot mode
      params.append('setup_id', setupId);

      // Always fetch both speeds from the UI sliders.
      const rSpeed = getRecordingSpeed();
      const pSpeed = getPlaybackSpeed();
      params.append('recording_speed', rSpeed);
      params.append('playback_speed', pSpeed);
      
      // Send command
      fetch('/send_command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      })
      .then(r => r.json())
      .then(data => {
        console.log(`Delete model response:`, data);
        // Remove the model from the dropdown
        const dropdown = document.getElementById('modelsDropdown');
        const optionToRemove = dropdown.querySelector(`option[value="${modelName}"]`);
        if (optionToRemove) {
          optionToRemove.remove();
        }

        dropdown.value = "";

      .catch(err => {

      });

    /**
     * Helper function to get the current dataset name for model operations
     */
    function getCurrentDatasetName() {
      const datasetsDropdown = document.getElementById('datasetsDropdown');
      return datasetsDropdown ? datasetsDropdown.value : '';
    }




    /**
     * The generic slider update function:
     * - If it's the "playback_speed" slider, we treat `newValue` as an array index.
     * - If it's the "recording_speed" slider, we just print the numeric value for now.
     */
    function updateSliderValue(sliderId, newValue) {
      const sliderValueSpan = document.getElementById(sliderId + '_value');
      if (!sliderValueSpan) return;

      if (sliderId === "playback_speed") {
        const slider = document.getElementById(sliderId);
        // Read the array of discrete speeds
        const speeds = JSON.parse(slider.getAttribute('data-speeds') || "[]");

        const index = parseInt(newValue, 10);
        if (index >= 0 && index < speeds.length) {
          sliderValueSpan.textContent = speeds[index];
        } else {
          sliderValueSpan.textContent = 'N/A';
        }
      } else {
        // For the "recording_speed" slider, just show the numeric value [0..100].
        sliderValueSpan.textContent = newValue;
      }
    }

    /**
     * Refresh datasets data and update icon visibility
     */
    function refreshDatasetsAndUpdateIcons() {
      fetch('/request_datasets', { method: 'POST' })
        .then(response => response.json())
        .then(datasetObjects => {
          // Update the global datasets list
          window.datasets = datasetObjects;
          
          // Update icon visibility for current selection
          const datasetsDropdown = document.getElementById('datasetsDropdown');
          const currentValue = datasetsDropdown.value;
          
          // Remove data-custom attribute if the dataset now exists on server
          if (currentValue) {
            const currentOption = datasetsDropdown.querySelector(`option[value="${currentValue}"]`);
            const existingDataset = datasetObjects.find(d => d.dataset_name === currentValue);
            if (currentOption && existingDataset) {
              currentOption.removeAttribute('data-custom');
            }
          }
          
          updateIconVisibility('datasetsDropdown', currentValue);
        })
        .catch(err => {
          console.error('Error refreshing datasets:', err);
          // Fallback to just updating with current data
          const datasetsDropdown = document.getElementById('datasetsDropdown');
          updateIconVisibility('datasetsDropdown', datasetsDropdown.value);
        });
    }

    /**
     * Refresh models data and update icon visibility
     */
    function refreshModelsAndUpdateIcons() {
      fetch('/request_models', { method: 'POST' })
        .then(response => response.json())
        .then(modelObjects => {
          // Update the global models list
          window.models = modelObjects;
          
          // Update icon visibility for current selection
          const modelsDropdown = document.getElementById('modelsDropdown');
          const currentValue = modelsDropdown.value;
          
          // Remove data-custom attribute if the model now exists on server
          if (currentValue) {
            const currentOption = modelsDropdown.querySelector(`option[value="${currentValue}"]`);
            const existingModel = modelObjects.find(m => m.model_name === currentValue);
            if (currentOption && existingModel) {
              currentOption.removeAttribute('data-custom');
            }
          }
          
          updateIconVisibility('modelsDropdown', currentValue);
        })
        .catch(err => {
          console.error('Error refreshing models:', err);
          // Fallback to just updating with current data
          const modelsDropdown = document.getElementById('modelsDropdown');
          updateIconVisibility('modelsDropdown', modelsDropdown.value);
        });
    }

    /**
     * Update icon visibility based on whether the selection is valid for rename/delete
     */
    function updateIconVisibility(dropdownId, selectedValue) {
      const dropdown = document.getElementById(dropdownId);
      const container = dropdown.parentElement;
      
      // Always remove the class first
      container.classList.remove('has-valid-selection');
      
      // Early return for invalid selections - icons should be hidden
      if (!selectedValue || 
          selectedValue === "" || 
          selectedValue === "NEW_DATASET" || 
          selectedValue === "NEW_MODEL") {
        return; // Icons will remain hidden
      }
      
      // Check if this is a custom item that hasn't been used yet
      const selectedOption = dropdown.querySelector(`option[value="${selectedValue}"]`);
      const isCustom = selectedOption && selectedOption.getAttribute('data-custom') === 'true';
      
      if (dropdownId === 'datasetsDropdown') {
        // For datasets: check if it exists in the server's dataset list
        const existingDataset = window.datasets && window.datasets.find(d => d.dataset_name === selectedValue);
        if (existingDataset || !isCustom) {
          container.classList.add('has-valid-selection');
        }
      } else if (dropdownId === 'modelsDropdown') {
        // For models: check if it exists in the server's model list  
        const existingModel = window.models && window.models.find(m => m.model_name === selectedValue);
        if (existingModel || !isCustom) {
          container.classList.add('has-valid-selection');
        }
      }
    }

    // Initialize icon visibility on page load
    document.addEventListener('DOMContentLoaded', function() {
      // Set initial icon visibility based on current selections
      updateIconVisibility('datasetsDropdown', document.getElementById('datasetsDropdown').value);
      updateIconVisibility('modelsDropdown', document.getElementById('modelsDropdown').value);
      
      // Add hover listeners to update icon visibility in real-time
      const datasetsContainer = document.getElementById('datasetsDropdown').parentElement;
      const modelsContainer = document.getElementById('modelsDropdown').parentElement;
      
      datasetsContainer.addEventListener('mouseenter', function() {
        updateIconVisibility('datasetsDropdown', document.getElementById('datasetsDropdown').value);
      });
      
      modelsContainer.addEventListener('mouseenter', function() {
        updateIconVisibility('modelsDropdown', document.getElementById('modelsDropdown').value);
      });
    });
  </script>
