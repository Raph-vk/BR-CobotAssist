<!DOCTYPE html>
<html>
<head>
  <title>TOS UI</title>
  <style>
    /* Main brand colors and scaling factor */
    :root {
      --color-blue: #2a4595;
      --color-red:  #d91b11;
      --scale-factor: {{ ui_scale_factor }}; /* Scaling factor from config.yaml */
    }

    /* Reset / Base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f2f2f2;
      color: #333;
      font-size: calc(18px * var(--scale-factor)); /* Increased base font size */
    }

    /* Full-width top header with centered logos */
    .header {
      width: 100%;
      background-color: var(--color-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(4rem * var(--scale-factor));
      padding: calc(0.5rem * var(--scale-factor)) calc(1rem * var(--scale-factor));
    }
    .logo-tos {
      height: calc(100px * var(--scale-factor));
      object-fit: contain;
    }
    .logo-breda {
      height: calc(100px * var(--scale-factor));
      object-fit: contain;
    }
    .logo-stimulus {
      height: calc(50px * var(--scale-factor));
      object-fit: contain;
    }

    /* Container for the two sections + red lines */
    .two-sections {
      position: relative;    
      width: calc(1200px * var(--scale-factor));         
      height: calc(840px * var(--scale-factor));         /* Increased from 800px to accommodate taller bottom box */
      margin: calc(2rem * var(--scale-factor)) auto;     
      background-color: #f2f2f2;
    }

    /* Red lines for top & bottom boxes */
    .line-top-left {
      position: absolute;
      top: 0;
      left: calc(-5px * var(--scale-factor));
      width: calc(5px * var(--scale-factor));
      height: calc(555px * var(--scale-factor)); /* Increased from 430px */
      background-color: var(--color-red);
    }
    .line-top-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: calc(5px * var(--scale-factor));
      top: calc(550px * var(--scale-factor)); /* Moved down from 430px */
      background-color: var(--color-red);
    }
    .line-bottom-right {
      position: absolute;
      top: calc(550px * var(--scale-factor)); /* Moved down from 430px */
      right: calc(-5px * var(--scale-factor));
      width: calc(5px * var(--scale-factor));
      height: calc(400px * var(--scale-factor)); /* Increased to match new bottom box height */
      background-color: var(--color-red);
    }

    /* Top box: increased height for larger content */
    .box-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(550px * var(--scale-factor)); /* Increased from 430px */
      background-color: #fff;
      border-radius: calc(6px * var(--scale-factor));
      box-shadow: 0 calc(2px * var(--scale-factor)) calc(4px * var(--scale-factor)) rgba(0,0,0,0.1);
      text-align: center;
      padding: calc(1.5rem * var(--scale-factor));
    }

    /* Box-bottom positioning */
    .box-bottom {
      position: absolute;
      top: calc(560px * var(--scale-factor)); /* Position below the box-top (550px height + 10px margin) */
      left: 0;
      width: 100%;
      text-align: center;
      padding: calc(1.5rem * var(--scale-factor));
    }

    /* Bottom box: increased height for larger content */
    .bottom-box {
      width: 100%;
      border: calc(3px * var(--scale-factor)) solid var(--color-red);
      border-radius: calc(15px * var(--scale-factor));
      height: calc(280px * var(--scale-factor)); /* Increased from 240px to fit playback speed content */
      overflow-y: auto;
      background-color: white;
      margin-top: calc(20px * var(--scale-factor));
    }

    /* Headings */
    .box-top h2,
    .box-bottom h2 {
      margin-bottom: calc(1rem * var(--scale-factor));
      color: var(--color-blue);
      font-size: calc(2.5rem * var(--scale-factor)); /* Much larger headings */
    }

    /* Buttons row(s) */
    .button-row {
      margin-top: calc(1rem * var(--scale-factor));
    }
    .btn {
      display: inline-block;
      width: calc(280px * var(--scale-factor));  /* Increased from 220px for larger text */
      white-space: nowrap;
      text-align: center;
      padding: calc(1.2rem * var(--scale-factor)) calc(1.5rem * var(--scale-factor)); /* Much larger padding */
      margin: calc(0.5rem * var(--scale-factor)) calc(0.75rem * var(--scale-factor));
      background-color: var(--color-blue);
      color: #fff;
      border-radius: calc(4px * var(--scale-factor));
      cursor: pointer;
      border: none;
      font-size: calc(1.4rem * var(--scale-factor)); /* Much larger button text */
      font-weight: bold;
      transition: background-color 0.2s ease-in-out;
    }
    .btn:hover {
      background-color: var(--color-red);
    }

    /* Fixed-width dropdown */
    #recordingsDropdown {
      width: calc(280px * var(--scale-factor)); /* Increased from 220px to match buttons */
      padding: calc(0.8rem * var(--scale-factor)); /* Larger padding */
      font-size: calc(1.4rem * var(--scale-factor)); /* Much larger dropdown text */
      margin: calc(0.5rem * var(--scale-factor)) calc(0.75rem * var(--scale-factor));
    }

    /* Bottom Box sliders area */
    .settings-section h3 {
      margin-bottom: calc(1rem * var(--scale-factor));
      color: var(--color-blue);
      font-size: calc(2rem * var(--scale-factor)); /* Much larger section headings */
    }
    .slider-row {
      margin: calc(1rem * var(--scale-factor)) auto;
      text-align: center;
      max-width: calc(700px * var(--scale-factor)); /* Increased to match pressure/position selector */
      display: flex;
      align-items: center;
      justify-content: center; /* Changed back to center for better alignment */
      gap: calc(0.5rem * var(--scale-factor));
    }
    .slider-row label {
      display: inline-block;
      min-width: calc(200px * var(--scale-factor)); /* Increased to match pressure/position labels for perfect colon alignment */
      text-align: right;
      font-size: calc(1.3rem * var(--scale-factor));
      font-weight: bold;
    }
    .slider-row input[type="range"] {
      vertical-align: middle;
      width: calc(150px * var(--scale-factor)); /* Keep consistent slider width */
      height: calc(8px * var(--scale-factor));
    }
    .slider-value {
      font-weight: bold;
      color: var(--color-blue);
      min-width: calc(70px * var(--scale-factor));
      text-align: left;
      font-size: calc(1.3rem * var(--scale-factor));
    }

    /* Settings section with two-column layout */
    .settings-section {
      display: grid;
      grid-template-columns: calc(250px * var(--scale-factor)) 1fr; /* Restored to 250px to prevent text wrapping */
      gap: calc(0.5rem * var(--scale-factor)); /* Reduced from 1rem for tighter spacing */
      row-gap: calc(2rem * var(--scale-factor)); /* Added vertical spacing between rows */
      align-items: center;
      max-width: calc(600px * var(--scale-factor)); /* Reduced max-width for better centering */
      margin: 0 auto; /* Center the settings section */
      justify-self: center; /* Additional centering */
    }

    /* Left column: labels */
    .setting-label {
      text-align: right;
      font-size: calc(1.3rem * var(--scale-factor));
      font-weight: bold;
      padding-right: calc(1rem * var(--scale-factor));
    }

    /* Right column: controls */
    .setting-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(1rem * var(--scale-factor));
    }

    /* Pressure/Position selector styles */
    .pressure-position-selector {
      display: contents; /* Use grid layout from parent */
    }

    .selector-buttons {
      display: flex;
      gap: calc(0.5rem * var(--scale-factor));
      width: calc(280px * var(--scale-factor)); /* Increased to match slider + value width */
    }
    .selector-button {
      flex: 1;
      padding: calc(0.8rem * var(--scale-factor)) calc(1rem * var(--scale-factor)); /* Much larger padding */
      border: calc(2px * var(--scale-factor)) solid #4a5a8a; /* Softer blue */
      background-color: white;
      color: #4a5a8a; /* Softer blue */
      cursor: pointer;
      border-radius: calc(4px * var(--scale-factor));
      font-weight: bold; /* Make text bold */
      font-size: calc(1.2rem * var(--scale-factor)); /* Much larger button text */
      transition: all 0.3s ease;
    }
    .selector-button:hover {
      background-color: #f5f5f5;
      border-color: #3a4a7a;
    }
    .selector-button.selected {
      background-color: rgba(217, 27, 17, 0.7); /* Same red as others but 70% opacity for subtlety */
      color: white;
      border-color: rgba(217, 27, 17, 0.7); /* Same opacity as background for consistent appearance */
    }

    /* Speed control styling */
    .speed-control-row {
      display: contents; /* Use grid layout from parent */
    }

    .speed-buttons {
      display: flex;
      gap: calc(0.5rem * var(--scale-factor));
      width: calc(280px * var(--scale-factor)); /* Match both selector buttons + gap total width */
    }
    
    .speed-button {
      flex: 1;
      padding: calc(0.8rem * var(--scale-factor)) calc(1rem * var(--scale-factor));
      border: calc(2px * var(--scale-factor)) solid #4a5a8a !important;
      border-radius: calc(4px * var(--scale-factor));
      background-color: white !important;
      color: #4a5a8a !important;
      cursor: pointer;
      font-size: calc(1.2rem * var(--scale-factor));
      font-weight: bold;
      transition: all 0.3s ease;
      box-sizing: border-box !important;
    }
    
    .speed-button:hover {
      background-color: #f5f5f5 !important;
      border-color: #3a4a7a !important;
      color: #3a4a7a !important;
    }
    
    .speed-button.active {
      background-color: rgba(217, 27, 17, 0.7) !important; /* Red selected state */
      color: white !important;
      border-color: rgba(217, 27, 17, 0.7) !important;
    }

    /* Fixed sanding pressure controls.
       The UI shows a process-friendly 0-100% sanding force value, while the
       backend receives the normalized VPPE balance setpoint (0.5-1.0). */
    .fixed-pressure-row {
      display: contents; /* Use grid layout from parent */
    }

    .fixed-pressure-toggle {
      display: flex;
      align-items: center;
      gap: calc(0.5rem * var(--scale-factor));
      width: calc(280px * var(--scale-factor));
      justify-content: center;
      color: #4a5a8a;
      font-size: calc(1.2rem * var(--scale-factor));
      font-weight: bold;
    }

    .fixed-pressure-toggle input[type="checkbox"] {
      width: calc(22px * var(--scale-factor));
      height: calc(22px * var(--scale-factor));
      accent-color: var(--color-red);
    }

    .fixed-pressure-control {
      display: flex;
      align-items: center;
      gap: calc(0.5rem * var(--scale-factor));
      width: calc(280px * var(--scale-factor));
    }

    .fixed-pressure-control input[type="range"] {
      flex: 1;
    }

    .fixed-pressure-value {
      min-width: calc(110px * var(--scale-factor));
      text-align: right;
      color: var(--color-blue);
      font-size: calc(1.1rem * var(--scale-factor));
      font-weight: bold;
    }

    /* Align all labels consistently */
    .slider-row {
      display: contents; /* Use grid layout from parent */
    }
    
    .slider-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(1rem * var(--scale-factor));
      width: calc(280px * var(--scale-factor)); /* Fixed width to match button width */
    }

    .slider-control input[type="range"] {
      flex: 1;
      max-width: calc(200px * var(--scale-factor));
    }

    .slider-value {
      min-width: calc(80px * var(--scale-factor));
      text-align: center;
    }

    /* Dropdown with action icons */
    .dropdown-with-icons {
      position: relative;
      display: inline-block;
    }

    .dropdown-option-icons {
      position: absolute;
      right: calc(30px * var(--scale-factor));
      top: 50%;
      transform: translateY(-50%);
      display: none;
      gap: calc(4px * var(--scale-factor));
      z-index: 1000;
    }

    .dropdown-option-icons .icon {
      cursor: pointer;
      padding: calc(6px * var(--scale-factor)); /* Larger padding */
      border-radius: calc(6px * var(--scale-factor)); /* Larger border radius */
      font-size: calc(24px * var(--scale-factor)); /* Much larger icons */
      opacity: 0.7;
      transition: all 0.2s;
      position: relative;
    }

    .dropdown-option-icons .icon:hover {
      opacity: 1;
      background-color: rgba(244, 67, 54, 0.1);
      color: #f44336 !important;
      transform: scale(1.1);
    }

    .icon-rename {
      color: #2196F3;
    }

    .icon-delete {
      color: #f44336;
    }

    /* Tooltip styling */
    .dropdown-option-icons .icon::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: calc(8px * var(--scale-factor)) calc(12px * var(--scale-factor)); /* Larger tooltip padding */
      border-radius: calc(6px * var(--scale-factor)); /* Larger border radius */
      font-size: calc(16px * var(--scale-factor)); /* Much larger tooltip text */
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 1001;
    }

    .dropdown-option-icons .icon:hover::after {
      opacity: 1;
    }

    /* Only show icons on hover when there's a valid selection */
    .dropdown-with-icons.has-valid-selection:hover .dropdown-option-icons {
      display: flex;
    }

    /* Hide icons when dropdown is open */
    .dropdown-with-icons select:focus + .dropdown-option-icons {
      display: none;
    }

    /* Error popup styles */
    .error-popup {
      position: fixed;
      top: calc(20px * var(--scale-factor));
      right: calc(20px * var(--scale-factor));
      background-color: #f44336;
      color: white;
      padding: calc(15px * var(--scale-factor)) calc(20px * var(--scale-factor));
      border-radius: calc(8px * var(--scale-factor));
      box-shadow: 0 calc(4px * var(--scale-factor)) calc(12px * var(--scale-factor)) rgba(0,0,0,0.3);
      max-width: calc(400px * var(--scale-factor));
      z-index: 9999;
      font-size: calc(16px * var(--scale-factor));
      font-weight: bold;
      cursor: pointer;
      transform: translateX(calc(420px * var(--scale-factor)));
      transition: transform 0.3s ease-in-out;
    }

    .error-popup.show {
      transform: translateX(0);
    }

    .error-popup .close-btn {
      float: right;
      margin-left: calc(10px * var(--scale-factor));
      font-size: calc(20px * var(--scale-factor));
      font-weight: bold;
      cursor: pointer;
      opacity: 0.7;
    }

    .error-popup .close-btn:hover {
      opacity: 1;
    }

    /* Custom Prompt Modal Styling */
    .custom-prompt-overlay {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .custom-prompt-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: calc(20px * var(--scale-factor));
      border-radius: calc(8px * var(--scale-factor));
      box-shadow: 0 calc(4px * var(--scale-factor)) calc(16px * var(--scale-factor)) rgba(0, 0, 0, 0.2);
      min-width: calc(300px * var(--scale-factor));
      max-width: calc(500px * var(--scale-factor));
    }

    .custom-prompt-title {
      margin: 0 0 calc(1rem * var(--scale-factor)) 0;
      font-size: calc(1.2rem * var(--scale-factor));
      font-weight: bold;
      color: var(--color-blue);
    }

    .custom-prompt-input {
      width: 100%;
      padding: calc(0.8rem * var(--scale-factor));
      border: calc(2px * var(--scale-factor)) solid #ddd;
      border-radius: calc(4px * var(--scale-factor));
      font-size: calc(1rem * var(--scale-factor));
      margin-bottom: calc(1.5rem * var(--scale-factor));
      box-sizing: border-box;
    }

    .custom-prompt-input:focus {
      border-color: var(--color-blue);
      outline: none;
    }

    .custom-prompt-buttons {
      display: flex;
      gap: calc(1rem * var(--scale-factor));
      justify-content: center;
    }

    .custom-prompt-btn {
      padding: calc(0.8rem * var(--scale-factor)) calc(1.5rem * var(--scale-factor));
      border: none;
      border-radius: calc(4px * var(--scale-factor));
      font-size: calc(1rem * var(--scale-factor));
      cursor: pointer;
      min-width: calc(80px * var(--scale-factor));
      transition: background-color 0.3s ease;
    }

    .custom-prompt-btn.primary {
      background-color: var(--color-blue);
      color: white;
    }

    .custom-prompt-btn.primary:hover {
      background-color: #1a2d75; /* Darker blue */
    }

    .custom-prompt-btn.secondary {
      background-color: #f0f0f0;
      color: #333;
    }

    .custom-prompt-btn.secondary:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <!-- Header with logos -->
  <div class="header">
    <img class="logo-tos" src="{{ url_for('static', filename='tos_logo.jpg') }}" alt="TOS Logo">
    <img class="logo-breda" src="{{ url_for('static', filename='breda_robotics_logo.png') }}" alt="Breda Robotics Logo">
    <img class="logo-stimulus" src="{{ url_for('static', filename='logo_stimulus.png') }}" alt="Stimulus Logo">
  </div>

  <!-- Main container for 2 boxes + the lines -->
  <div class="two-sections">
    <div class="line-top-left"></div>
    <div class="line-top-bottom"></div>
    <div class="line-bottom-right"></div>

    <!-- Top Box -->
    <div class="box-top">
      <h2>TOS UI Controls</h2>
      
      <!-- Teachbot mode: Show setup info only when multiple setups are defined -->
      {% if total_setups >= 2 %}
      <div style="text-align: center; margin: calc(20px * var(--scale-factor)) 0;">
        <span style="font-size: calc(1.6rem * var(--scale-factor)); color: var(--color-blue); font-weight: bold;">
          Using {{ setups[0].display_name }}
        </span>
      </div>
      {% endif %}

      <div class="button-row">
        <button class="btn" onclick="sendCommand('start_teleoperation')">
          Start Teleop
        </button>
      </div>


      <div class="button-row">
        <div class="dropdown-with-icons">
          <select id="recordingsDropdown"
                  onmouseover="fetchRecordingsInBackground()" 
                  onfocus="fetchRecordingsInBackground()"
                  onchange="onRecordingSelected()">
            <option hidden value="">Select name...</option>
          </select>
          <div class="dropdown-option-icons">
            <span class="icon icon-rename" onclick="renameSelectedRecording()" data-tooltip="Rename recording">✏️</span>
            <span class="icon icon-delete" onclick="deleteSelectedRecording()" data-tooltip="Delete recording">🗑️</span>
          </div>
        </div>

      </div>
      <div class="button-row">
        <button class="btn" onclick="sendCommand('start_teleoperation_record')">
          Start Teleop &amp; Record
        </button>
          <button class="btn" onclick="playSelectedRecording()">
          Play Recording
        </button>
      </div>

      <div class="button-row">
        <button class="btn" onclick="sendCommand('stop')">
          Stop
        </button>
      </div>
    </div>



    <!-- Bottom Box -->
    <div class="box-bottom">
      <h2>Settings</h2>
      <div class="settings-section">
      
      <!-- Pressure/Position Selector -->
      <div class="pressure-position-selector">
        <div class="setting-label">Control Mode:</div>
        <div class="setting-control">
          <div class="selector-buttons">
            <button type="button" class="selector-button selected" id="pressure-btn" onclick="selectPressurePosition('pressure')">Pressure</button>
            <button type="button" class="selector-button" id="position-btn" onclick="selectPressurePosition('position')">Position</button>
          </div>
        </div>
      </div>
      
      <!-- Fixed sanding pressure.
           When enabled, recording/playback use this fixed value while the
           trigger/pot only decides whether sanding pressure is applied. -->
      <div class="fixed-pressure-row">
        <div class="setting-label">Fixed Pressure:</div>
        <div class="setting-control">
          <label class="fixed-pressure-toggle">
            <input type="checkbox" id="fixed-pressure-enabled" onchange="updateFixedPressureDisplay()">
            Enable
          </label>
        </div>
      </div>

      <div class="fixed-pressure-row">
        <div class="setting-label">Sanding Force:</div>
        <div class="setting-control">
          <div class="fixed-pressure-control">
            <input type="range" id="fixed-pressure-slider" min="0" max="100" step="1" value="50" oninput="updateFixedPressureDisplay()">
            <span id="fixed-pressure-value" class="fixed-pressure-value">50% / 0.75</span>
          </div>
        </div>
      </div>

      <!-- Recording Speed buttons -->
      <div class="speed-control-row">
        <div class="setting-label">Recording Speed:</div>
        <div class="setting-control">
          <div class="speed-buttons" id="recording-speed-buttons">
            <button type="button" class="speed-button" data-speed="0.25" onclick="selectRecordingSpeed(0)">0.25</button>
            <button type="button" class="speed-button active" data-speed="0.5" onclick="selectRecordingSpeed(1)">0.5</button>
            <button type="button" class="speed-button" data-speed="1.0" onclick="selectRecordingSpeed(2)">1.0</button>
          </div>
        </div>
      </div>

      <script>
        // Global variable to track extra_function1 state
        window.extra_function1 = true; // Default to Pressure mode (true)
        
        // Global variables to track selected speeds
        window.selectedRecordingSpeedIndex = 1; // Default to 0.5x (index 1)
        window.selectedPlaybackSpeedIndex = 0; // Default to first option

        // Fixed pressure mapping:
        // 0% sanding force means neutral VPPE balance (0.5).
        // 100% sanding force means maximum plate-side bias (1.0).
        // The trigger/pot decides when this value is applied during record/playback.
        window.fixedPressureNeutral = 0.5;
        window.fixedPressureMaxOffset = 0.5;
        window.fixedPressureTriggerThreshold = 0.2;
        
        function selectPressurePosition(mode) {
          const pressureBtn = document.getElementById('pressure-btn');
          const positionBtn = document.getElementById('position-btn');
          
          // Remove selected class from both buttons
          pressureBtn.classList.remove('selected');
          positionBtn.classList.remove('selected');
          
          // Add selected class to clicked button and set global variable
          if (mode === 'pressure') {
            pressureBtn.classList.add('selected');
            window.extra_function1 = true;
            console.log('Pressure mode selected - extra_function1:', window.extra_function1);
          } else {
            positionBtn.classList.add('selected');
            window.extra_function1 = false;
            console.log('Position mode selected - extra_function1:', window.extra_function1);
          }
        }

        function getFixedPressurePercent() {
          const slider = document.getElementById('fixed-pressure-slider');
          return slider ? parseFloat(slider.value) : 50.0;
        }

        function getFixedPressureSetpoint() {
          const percent = getFixedPressurePercent();
          const normalized = window.fixedPressureNeutral + (percent / 100.0) * window.fixedPressureMaxOffset;
          return Math.max(0.0, Math.min(1.0, normalized));
        }

        function updateFixedPressureDisplay() {
          const valueLabel = document.getElementById('fixed-pressure-value');
          if (!valueLabel) return;

          const percent = getFixedPressurePercent();
          const setpoint = getFixedPressureSetpoint();

    /**

    /**
     * Called whenever the user selects a new recording in the dropdown.
     * We find its associated recording_speed and set up the playback_speed slider accordingly.
     */
    function onRecordingSelected() {
      const dropdown = document.getElementById('recordingsDropdown');
      const selectedFile = dropdown.value;
      
      // Update icon visibility based on valid selection
      updateIconVisibility('recordingsDropdown', selectedFile);
      
      if (!selectedFile) return;

      // Handle "New..." option
      if (selectedFile === "NEW_RECORDING") {
        const now = new Date();
        const defaultName = now.getFullYear().toString() + 
                           (now.getMonth() + 1).toString().padStart(2, '0') + 
                           now.getDate().toString().padStart(2, '0') + '_' +
                           now.getHours().toString().padStart(2, '0') + 
                           now.getMinutes().toString().padStart(2, '0') + 
                           now.getSeconds().toString().padStart(2, '0');
        
        showCustomPrompt('Enter new recording name:', defaultName).then(newName => {
        if (newName && newName.trim()) {
          // Remove any existing custom recording first
          const existingCustomOption = dropdown.querySelector('option[data-custom="true"]');
          if (existingCustomOption) {
            existingCustomOption.remove();
          }
          
          // Create a new option with the entered name
          const newOpt = document.createElement('option');
          // Store the name with .json extension as the value (for backend)
          const nameWithExtension = newName.trim().endsWith('.json') ? newName.trim() : newName.trim() + '.json';
          newOpt.value = nameWithExtension;
          // Display without .json extension for cleaner UI
          newOpt.textContent = newName.trim();
          // Mark as custom recording
          newOpt.setAttribute('data-custom', 'true');
          // Insert before the "New..." option
          dropdown.insertBefore(newOpt, dropdown.lastElementChild);
          dropdown.value = nameWithExtension;
          
          // Set default playback speed options for new recording
          setPlaybackSpeedOptions(1.0); // Default recording speed
          } else {
            // Reset to empty if cancelled or empty
            dropdown.value = "";
            return;
          }
        });
        return;
      } else {
        // Find the recording object in window.recordings
        const selectedObj = window.recordings.find(
          rec => rec.file_name === selectedFile
        );
        if (!selectedObj) {
          console.warn("No matching recording object found for:", selectedFile);
          // Set default playback speed for custom recordings
          setPlaybackSpeedOptions(1.0);
          return;
        }

        // Extract the speed. If it's 0.25, 0.5, or 1.0, we choose a set of discrete speeds.
        // Otherwise, provide a fallback or your desired default set.
        const recordingSpeed = selectedObj.recording_speed;
        setPlaybackSpeedOptions(recordingSpeed);
      }
    }

    /**
     * Depending on the recording speed, limit the playback speeds to a discrete set.
     * Then create buttons dynamically and select the one closest to 1.0x.
     */
    function setPlaybackSpeedOptions(recordingSpeed) {
      let speeds;
      switch (recordingSpeed) {
        case 0.25:
          speeds = [0.5, 1.0, 2.0, 4.0];
          break;
        case 0.5:
          speeds = [0.25, 0.5, 1.0, 2.0];
          break;
        case 1.0:
          speeds = [0.25, 0.5, 0.75, 1.0];
          break;
        default:
          // If recordingSpeed is something else (null or 0.8?), pick a fallback:
          speeds = [0.25, 0.5, 1.0, 2.0]; // up to you
          break;
      }

      const playbackButtonsContainer = document.getElementById('playback-speed-buttons');
      playbackButtonsContainer.innerHTML = ''; // Clear existing buttons

      // Create buttons for each speed
      speeds.forEach((speed, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'speed-button';
        button.setAttribute('data-speed', speed);
        button.textContent = speed;
        button.onclick = () => selectPlaybackSpeed(index);
        playbackButtonsContainer.appendChild(button);
      });

      // Default to the index of "1.0" if present, else 0
      let defaultIndex = speeds.indexOf(1.0);
      if (defaultIndex < 0) {
        defaultIndex = 0;
      }
      
      // Set the active button
      selectPlaybackSpeed(defaultIndex);
    }

    function sendCommand(cmd, itemName = null) {
      const params = new URLSearchParams({ 'message': cmd });

      // Always attach the itemName if provided.
      // For recording commands, this will be the recording_name
      if (itemName) {
        if (cmd.includes('recording') || cmd === 'play_recording' || cmd === 'delete_recording') {
          // Don't send the special "NEW_RECORDING" value
          if (itemName !== 'NEW_RECORDING') {
            params.append('recording_name', itemName);
          }
        } else {
          // Generic fallback - avoid sending special values
          if (itemName !== 'NEW_RECORDING') {
            params.append('item_name', itemName);
          }
        }
      }

      // For record commands, automatically include the selected recording name
      if (cmd === 'start_teleoperation_record') {
        const recordingsDropdown = document.getElementById('recordingsDropdown');
        const selectedRecording = recordingsDropdown ? recordingsDropdown.value : '';
        
        // Check if we have a valid recording name (not empty and not the special NEW_RECORDING value)
        if (!selectedRecording || selectedRecording === 'NEW_RECORDING') {
          alert('Please select a recording name first.');
          return; // Don't proceed without a recording name
        }
        
        // Check if this is an existing recording and show overwrite warning
        const existingRecording = window.recordings.find(r => r.file_name === selectedRecording);
        if (existingRecording) {
          const confirmed = confirm(`Recording "${selectedRecording}" already exists. Do you want to overwrite it?`);
          if (!confirmed) {
            console.log('Recording cancelled by user');
            return; // Don't proceed with the command
          }
        }
        
        params.append('recording_name', selectedRecording);
      }

      // Always fetch both speeds from the UI sliders.
      const rSpeed = getRecordingSpeed();
      const pSpeed = getPlaybackSpeed();
      params.append('recording_speed', rSpeed);
      params.append('playback_speed', pSpeed);

      // Add extra_function1 parameter for relevant commands
      if (cmd === 'start_teleoperation' || cmd === 'start_teleoperation_record' || cmd === 'play_recording') {
        params.append('extra_function1', window.extra_function1);
        console.log(`Adding extra_function1: ${window.extra_function1} to command: ${cmd}`);
      }

      // Fixed sanding pressure is only implemented for recording and playback.
      // Normal start_teleoperation keeps the live potmeter behavior for manual testing.
      if (cmd === 'start_teleoperation_record' || cmd === 'play_recording') {
        appendFixedPressureParams(params);
      }

      // Teachbot mode: automatically use the single active setup
      const setupId = '{{ setups[0].setup_id }}';
      params.append('setup_id', setupId);
      
      // Send command to the single setup
      fetch('/send_command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      })
      .then(r => r.json())
      .then(data => {
        console.log(`Command response for setup ${setupId}:`, data);
        
        // After successful recording operations, update icon visibility
        if (data.success && cmd === 'start_teleoperation_record') {
          // Immediately remove data-custom attribute for current selection
          const recordingsDropdown = document.getElementById('recordingsDropdown');
          const currentValue = recordingsDropdown.value;
          if (currentValue) {
            const currentOption = recordingsDropdown.querySelector(`option[value="${currentValue}"]`);
            if (currentOption && currentOption.getAttribute('data-custom') === 'true') {
              currentOption.removeAttribute('data-custom');
              // Update icon visibility immediately
              updateIconVisibility('recordingsDropdown', currentValue);
            }
          }
          // Also refresh recordings data for consistency
          setTimeout(() => {
            refreshRecordingsAndUpdateIcons();
          }, 200);
        }
      })
      .catch(err => console.error(`Error sending command to setup ${setupId}:`, err));
    }

    /**

    function getPlaybackSpeed() {

    /**
     * Fetch latest recordings from server, store them globally in window.recordings,
     * and repopulate the <select> with the .file_name values only.
     */
    function fetchRecordingsInBackground() {
      const dropdown = document.getElementById('recordingsDropdown');
      const oldSelected = dropdown.value;
      
      // Store the current custom recording if it exists
      let customRecording = null;
      const customOption = dropdown.querySelector('option[data-custom="true"]');
      if (customOption) {
        customRecording = {
          value: customOption.value,
          displayName: customOption.textContent
        };
      }

      fetch('/request_recordings', { method: 'POST' })
        .then(response => response.json())
        .then(recordingObjects => {
          // Store entire array so we can look up speeds
          window.recordings = recordingObjects;

          dropdown.innerHTML = "";
          const placeholder = document.createElement('option');
          placeholder.value = "";
          placeholder.hidden = true;
          placeholder.textContent = "Select name...";
          dropdown.appendChild(placeholder);

          // For each {file_name, recording_speed}, we only show file_name without .json extension.
          recordingObjects.forEach(obj => {
            const { file_name, recording_speed } = obj;
            const opt = document.createElement('option');
            // Store the full filename with .json extension as the value
            opt.value = file_name;
            // Display without .json extension for cleaner UI
            const displayName = file_name.endsWith('.json') ? file_name.slice(0, -5) : file_name;
            opt.textContent = displayName;
            // Store speed in data attribute if you want quick lookups
            opt.dataset.speed = recording_speed;
            dropdown.appendChild(opt);
          });

          // Re-add the single custom recording if it exists and wasn't found in server recordings
          if (customRecording && !recordingObjects.some(r => r.file_name === customRecording.value)) {
            const opt = document.createElement('option');
            opt.value = customRecording.value;
            opt.textContent = customRecording.displayName;
            opt.setAttribute('data-custom', 'true');
            dropdown.appendChild(opt);
          }

          // Add "New..." option
          const newOpt = document.createElement('option');
          newOpt.value = "NEW_RECORDING";
          newOpt.textContent = "New...";
          dropdown.appendChild(newOpt);

          // restore old selection if valid
          const allValidNames = recordingObjects.map(r => r.file_name);
          if (customRecording) allValidNames.push(customRecording.value);
          
          if (allValidNames.includes(oldSelected)) {
            dropdown.value = oldSelected;
          } else {
            dropdown.value = "";
          }
        })
        .catch(err => console.error('Error fetching recordings:', err));
    }

    /**
     * Update icon visibility based on whether the selection is valid for rename/delete
     */
    function updateIconVisibility(dropdownId, selectedValue) {
      const dropdown = document.getElementById(dropdownId);
      const container = dropdown.parentElement;
      
      // Always remove the class first
      container.classList.remove('has-valid-selection');
      
      // Early return for invalid selections - icons should be hidden
      if (!selectedValue || 
          selectedValue === "" || 
          selectedValue === "NEW_RECORDING") {
        return; // Icons will remain hidden
      }
      
      // Check if this is a custom item that hasn't been used yet
      const selectedOption = dropdown.querySelector(`option[value="${selectedValue}"]`);
      const isCustom = selectedOption && selectedOption.getAttribute('data-custom') === 'true';
      
      if (dropdownId === 'recordingsDropdown') {
        // For recordings: check if it exists in the server's recording list
        const existingRecording = window.recordings && window.recordings.find(r => r.file_name === selectedValue);
        if (existingRecording || !isCustom) {
          container.classList.add('has-valid-selection');
        }
      }

    /**
     * Refresh recordings data and update icon visibility
     */
    function refreshRecordingsAndUpdateIcons() {
      fetch('/request_recordings', { method: 'POST' })
        .then(response => response.json())
        .then(recordingObjects => {
          // Update the global recordings list
          window.recordings = recordingObjects;
          
          // Update icon visibility for current selection
          const recordingsDropdown = document.getElementById('recordingsDropdown');
          const currentValue = recordingsDropdown.value;
          
          // Remove data-custom attribute if the recording now exists on server
          if (currentValue) {
            const currentOption = recordingsDropdown.querySelector(`option[value="${currentValue}"]`);
            const existingRecording = recordingObjects.find(r => r.file_name === currentValue);
            if (currentOption && existingRecording) {
              currentOption.removeAttribute('data-custom');
            }
          }
          
          updateIconVisibility('recordingsDropdown', currentValue);
        })
        .catch(err => {
          console.error('Error refreshing recordings:', err);
          // Fallback to just updating with current data
          const recordingsDropdown = document.getElementById('recordingsDropdown');
          updateIconVisibility('recordingsDropdown', recordingsDropdown.value);
        });
    }

    // Initialize icon visibility on page load
    document.addEventListener('DOMContentLoaded', function() {
      // Set initial icon visibility based on current selection
      updateIconVisibility('recordingsDropdown', document.getElementById('recordingsDropdown').value);
      
      // Add hover listener to update icon visibility in real-time
      const recordingsContainer = document.getElementById('recordingsDropdown').parentElement;
      
      recordingsContainer.addEventListener('mouseenter', function() {
        updateIconVisibility('recordingsDropdown', document.getElementById('recordingsDropdown').value);
      });
      
      // Initialize speed button states
      selectRecordingSpeed(window.selectedRecordingSpeedIndex);
    });

    // Error message polling and display functionality
    function checkForErrors() {
      fetch('/get_error_messages')
        .then(response => response.json())
        .then(data => {
          if (data.success && data.errors && data.errors.length > 0) {
            data.errors.forEach(error => {
              showErrorPopup(error.message);
            });
          }
        })
        .catch(err => {
          console.error('Error checking for error messages:', err);
        });
    }

    function showErrorPopup(message) {
      // Remove any existing error popup
      const existingPopup = document.querySelector('.error-popup');
      if (existingPopup) {
        existingPopup.remove();
      }

      // Create new popup
      const popup = document.createElement('div');
      popup.className = 'error-popup';
      popup.innerHTML = `
        <span class="close-btn" onclick="this.parentElement.remove()">&times;</span>
        <div>${message}</div>
      `;

      // Add to body
      document.body.appendChild(popup);

      // Trigger animation
      setTimeout(() => {
        popup.classList.add('show');
      }, 100);

      // Auto-close after 8 seconds
      setTimeout(() => {
        if (popup && popup.parentElement) {
          popup.classList.remove('show');
          setTimeout(() => {
            if (popup && popup.parentElement) {
              popup.remove();
            }
          }, 300);
        }
      }, 8000);

      // Allow manual close by clicking the popup
      popup.addEventListener('click', function() {
        popup.classList.remove('show');
        setTimeout(() => {
          if (popup && popup.parentElement) {
            popup.remove();
          }
        }, 300);
      });
    }

    // Start polling for errors every 2 seconds
    setInterval(checkForErrors, 2000);
    
    // Check immediately on load
    checkForErrors();

    // Custom prompt modal system
    function showCustomPrompt(title, defaultValue = '') {
      return new Promise((resolve) => {
        const modal = document.getElementById('customPromptModal');
        const input = document.getElementById('customPromptInput');
        const titleElement = document.getElementById('customPromptTitle');
        
        titleElement.textContent = title;
        input.value = defaultValue;
        modal.style.display = 'block';
        input.focus();
        input.select();
        
        window.customPromptResolve = resolve;
      });
    }

    function closeCustomPrompt() {
      const modal = document.getElementById('customPromptModal');
      modal.style.display = 'none';
      if (window.customPromptResolve) {
        window.customPromptResolve(null);
        window.customPromptResolve = null;
      }
    }

    function confirmCustomPrompt() {
      const input = document.getElementById('customPromptInput');
      const value = input.value;
      const modal = document.getElementById('customPromptModal');
      modal.style.display = 'none';
      if (window.customPromptResolve) {
        window.customPromptResolve(value);
        window.customPromptResolve = null;
      }
    }

    // Handle Enter key in the input
    document.getElementById('customPromptInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        confirmCustomPrompt();
      } else if (e.key === 'Escape') {
        closeCustomPrompt();
      }
    });

    // Handle clicks outside the modal
    document.getElementById('customPromptModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeCustomPrompt();
      }
    });
  </script>

  <!-- Custom Prompt Modal -->
  <div id="customPromptModal" class="custom-prompt-overlay">
    <div class="custom-prompt-content">
      <h3 id="customPromptTitle" class="custom-prompt-title"></h3>
      <input type="text" id="customPromptInput" class="custom-prompt-input">
      <div class="custom-prompt-buttons">
        <button class="custom-prompt-btn secondary" onclick="closeCustomPrompt()">Cancel</button>
        <button class="custom-prompt-btn primary" onclick="confirmCustomPrompt()">OK</button>
      </div>
    </div>
  </div>
  
</body>
</html>
