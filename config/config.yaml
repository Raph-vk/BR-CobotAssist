# --------------------------------------GENERAL CONFIGURATION--------------------------------


general:
  # Update settings
  status_refresh_period:  0.016067
  check_queue_period:     0.005556 
  check_queue_period_divisor: 3

  # start_position: [0, -20, -50, 0, 30, 50, 0]  # 6 joints + gripper state
  start_position: [0, 0, 0, 0, 0, 0, 0]  # Default start position: 6 robot joints + gripper state 
  start_joint_tolerance: 10
  joint_synchronization: False
  default_recording_speed: 0.25
  gripper_delay: 0.3 # In seconds on robot speed 1
  gripper_treshold: 0.5
  action_buffer_length: 3
  j4_locked: True


  app_directory: "."
  data_directory: "../tos_app_data"

  record_duration: 5
  record_divisor: 4
  
  # Policy interface buffer settings
  policy_img_buffer_size: 1  # Size of policy interface camera buffers

  control_loop_language: "python"  # Options: "cpp", "python"



logging:
  log_level: "DEBUG"
  library_log_levels:
    pika: "WARNING"
    werkzeug: "ERROR"
    matplotlib: "WARNING"  # Suppress verbose font debugging logs
  config_dict:
    version: 1
    disable_existing_loggers: false
    formatters:
      standard:
        # Example format
        format: "%(asctime)s [%(levelname)s][...] %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: standard
        level: "INFO"
      file:
        class: logging.handlers.RotatingFileHandler
        filename: "logs/dummy_log"
        formatter: standard
        level: "INFO"
        maxBytes: 5242880  # 5 MB
        backupCount: 3
    root:
      handlers: ["console", "file"]
      level: "INFO"



application:
  # General Application Settings
  flask_host: "0.0.0.0"
  flask_port: 5000
  flask_debug: false
  flask_use_reloader: false
  connection_threshold: 1.0
  # Path to the controller script
  controller_path: "applications/robot_controller/main.py"
  # Whether to open the controller script in a new terminal by default
  open_terminal_default: true



rabbitmq:
  exchange_name: "tos_exchange"
  exchange_type: "topic"

  # Status queue/binding
  ui_queue_name: "ui_status_queue"
  status_binding_key: "robot_controller.status.package"

  # Command queue/binding
  command_queue_name: "robot_controller_commands"
  command_binding_key_prefix: "robot_controller.command."

  # response queue/binding
  response_queue_name: "robot_controller_response"
  response_binding_key_prefix: "robot_controller.response."

  # Connection defaults
  host: "localhost"
  user: "guest"
  pass: "guest"
  heartbeat: 30
  blocked_connection_timeout: 2
  max_retries: 0     # 0 means infinite retry
  wait_seconds: 2.0

  # RabbitMQ client properties
  client_name_ui_sender: "ui_command_sender"
  client_name_ui_status: "ui_status_consumer"
  client_name_default: "my_conn"
  product: "MyRabbitApp"
  information: "A robust RabbitMQ client using Pika"



cpp:
  # Shared memory configuration for C++ interface
  shared_memory:
    # For save interface (recording)
    shm_joint_data1:
      shm_name: "shm_cpp_joint_data1"
      slot_format_template: "=8d8d8d??Idd"  # kMaxDof=8 for each position array
      header_format: "=IIII"
    # For policy interface (real-time control)
    shm_joint_data2:
      shm_name: "shm_cpp_joint_data2"
      capacity: 100
      slot_format_template: "=8d8d8d??Idd"  # kMaxDof=8 for each position array
      header_format: "=IIII" 



policy:
  name: "ACT"
  # Shared memory configuration for policy interface
  shared_memory:
    shm_name: "shm_target_pos2"
    capacity: 500  # Number of sequence entries - should match policy_sequence_buffer_length
    entry_format_template: "=I{dof}d"  # sequence_id (I) + dof joint positions (d each)
