# --------------------------------------GENERAL CONFIGURATION--------------------------------






logging:
  log_level: "DEBUG"
  library_log_levels:
    pika: "WARNING"
    werkzeug: "ERROR"
    matplotlib: "WARNING"  # Suppress verbose font debugging logs
  config_dict:
    version: 1
    disable_existing_loggers: false
    formatters:
      standard:
        # Example format
        format: "%(asctime)s [%(levelname)s][...] %(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: standard
        level: "INFO"
      file:
        class: logging.handlers.RotatingFileHandler
        filename: "logs/dummy_log"
        formatter: standard
        level: "INFO"
        maxBytes: 5242880  # 5 MB
        backupCount: 3
    root:
      handlers: ["console", "file"]
      level: "INFO"



application:
  # General Application Settings
  flask_host: "0.0.0.0"
  flask_port: 5000
  flask_debug: false
  flask_use_reloader: false
  connection_threshold: 1.0
  # Path to the controller script
  controller_path: "applications/robot_controller/main.py"
  # Whether to open the controller script in a new terminal by default
  open_terminal_default: false
  # Whether to automatically open browser window for TOS UI
  open_browser_default: true



rabbitmq:
  exchange_name: "tos_exchange"
  exchange_type: "topic"

  # UI queue configuration - receives from all active setups
  ui_status_queue_name: "ui_status_queue"
  ui_status_binding_patterns:
    # For active_setups, this creates bindings:
    - "robot_controller.*.status.*"    # Receive all robot status updates
    - "robot_controller.*.response.*"  # Receive all robot responses

  # Each robot controller will create queues based on its setup_id:
  robot_queue_patterns:
    command_queue: "robot_controller_{setup_id}_commands"     # e.g., "robot_controller_1_commands", "robot_controller_2_commands"
    response_queue: "robot_controller_{setup_id}_responses"   # e.g., "robot_controller_1_responses", "robot_controller_2_responses"
    
    # Command bindings for each robot (what commands they listen to)
    command_bindings:
      - "robot_controller.{setup_id}.command.*"  # Individual commands: robot_controller.1.command.move
      - "robot_controller.all.command.*"         # Broadcast commands: robot_controller.all.command.stop
    
    # Publishing patterns for robot responses and status
    status_routing_key: "robot_controller.{setup_id}.status.package"
    response_routing_key: "robot_controller.{setup_id}.response.{action}"

  # Connection defaults
  host: "localhost"
  user: "guest"
  pass: "guest"
  heartbeat: 30
  blocked_connection_timeout: 2
  max_retries: 0     # 0 means infinite retry
  wait_seconds: 2.0

  # RabbitMQ client properties
  client_name_ui_sender: "ui_command_sender"
  client_name_ui_status: "ui_status_consumer"
  client_name_default: "my_conn"
  product: "MyRabbitApp"
  information: "A robust RabbitMQ client using Pika"


cpp:
  # Shared memory configuration for C++ interface
  shared_memory:
    # For save interface (recording)
    shm_joint_data1:
      shm_name: "shm_cpp_joint_data1"
      slot_format_template: "=8d8d8d??Idd"  # kMaxDof=8 for each position array
      header_format: "=IIII"
    # For policy interface (real-time control)
    shm_joint_data2:
      shm_name: "shm_cpp_joint_data2"
      capacity: 100
      slot_format_template: "=8d8d8d??Idd"  # kMaxDof=8 for each position array
      header_format: "=IIII" 


policy:
  name: "ACT"
  # Temporal ensemble configuration
  temporal_ensemble:
    enabled: true
    overlap_weight: 0.5  # Weight for overlapping actions (0.0 to 1.0)
  # Shared memory configuration for policy interface
  shared_memory:
    shm_name: "shm_target_pos2"
    capacity: 500  # Number of sequence entries - should match policy_sequence_buffer_length
    entry_format_template: "=I{dof}d"  # sequence_id (I) + dof joint positions (d each)
